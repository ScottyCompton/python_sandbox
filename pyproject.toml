[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox"
version = "0.1.0"
description = "My Python sandbox project"
dependencies = [
    "pytest",
    "pytest-cov"
]

[tool.poe.tasks]
run-simple-filter = "python simple_filter/main.py"
test-simple-filter = "pytest simple_filter"
test-simple-filter-cov = "pytest --cov=simple_filter/ --cov-report=term-missing simple_filter/"